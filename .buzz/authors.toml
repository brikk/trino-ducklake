# Buzz identity → git author mapping.
#
# Maps a Buzz / Nostr pubkey (hex) to the git author identity that an agent
# commits under when that person issues the work. The pubkey is authoritative
# for *who asked* (every Buzz event is signed); this file is authoritative for
# *what git name/email that key commits as*. Edits are reviewed like code.
#
# Add yourself with a new [<hex-pubkey>] table. npub shown in the comment for
# human readability; the table key must be the 64-char hex form.

